<style>
:root {
  --ink: #0b0a09;
  --ink-soft: #14110e;
  --paper: #ece5d5;
  --paper-soft: #b8a78a;
  --paper-mute: #6a6258;
  --line: rgba(184, 167, 138, 0.18);
  --accent: #c9a875;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: 'Inter', 'Noto Serif JP', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 300;
  line-height: 1.7;
  overflow-x: hidden;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* ===== NAVIGATION ===== */
.site-nav {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 1.6rem 3rem;
  z-index: 100;
  background: linear-gradient(to bottom, rgba(11,10,9,0.92), rgba(11,10,9,0));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: padding 0.4s ease, background 0.4s ease;
}
.site-nav.scrolled {
  padding: 1rem 3rem;
  background: rgba(11,10,9,0.94);
}
.nav-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem; font-weight: 400;
  letter-spacing: 0.28em;
  color: var(--paper);
  white-space: nowrap;
}
.nav-links {
  list-style: none; display: flex; gap: 2.4rem;
}
.nav-links a {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.92rem; letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper-soft);
  transition: color 0.3s ease;
}
.nav-links a:hover { color: var(--paper); }
.nav-toggle { display: none; background: none; border: none; color: var(--paper); cursor: pointer; }

@media (max-width: 768px) {
  .site-nav { padding: 1rem 1.2rem; }
  .nav-logo { font-size: 0.95rem; letter-spacing: 0.16em; }
  .nav-links { display: none; position: absolute; top: 100%; left: 0; right: 0;
    flex-direction: column; gap: 0; padding: 1rem 1.5rem 2rem;
    background: rgba(11,10,9,0.98); backdrop-filter: blur(8px); }
  .nav-links.open { display: flex; }
  .nav-links li { border-bottom: 1px solid var(--line); padding: 1.1rem 0; }
  .nav-toggle { display: block; font-size: 1.4rem; letter-spacing: 0.18em; }
}

/* ===== HERO ===== */
#hero {
  position: relative;
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 3rem; overflow: hidden;
}
.hero-bg-slides {
  position: absolute; inset: 0; z-index: 0; overflow: hidden;
  background: var(--ink);
}
.hero-bg-slide {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  opacity: 0;
  transition: opacity 2.4s ease-in-out;
}
.hero-bg-slide.active {
  opacity: 0.42;
  animation: kenBurns 12s ease-out forwards;
}
@keyframes kenBurns {
  0% { transform: scale(1.0); }
  100% { transform: scale(1.10); }
}
.hero-bg-veil {
  position: absolute; inset: 0; z-index: 1;
  background: 
    radial-gradient(ellipse at 30% 50%, transparent 0%, rgba(11,10,9,0.55) 70%),
    linear-gradient(to bottom, rgba(11,10,9,0.32) 0%, rgba(11,10,9,0.18) 40%, rgba(11,10,9,0.85) 100%);
}
.hero-content {
  position: relative; z-index: 2;
  max-width: 1100px; margin: 0 auto; width: 100%;
}
.hero-mark {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.95rem; color: var(--paper-soft);
  letter-spacing: 0.32em;
  margin-bottom: 2.5rem;
  opacity: 0; animation: heroFadeUp 1.4s ease 0.3s forwards;
}
.hero-mark::before {
  content: ""; display: inline-block;
  width: 38px; height: 1px; background: var(--paper-soft);
  vertical-align: middle; margin-right: 1.1rem;
}
.hero-title {
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  font-size: clamp(2.6rem, 7vw, 5.6rem);
  line-height: 1.28; letter-spacing: 0.04em;
  color: var(--paper);
  margin-bottom: 2.4rem;
  opacity: 0; animation: heroFadeUp 1.6s ease 0.7s forwards;
}
.hero-title em {
  font-style: normal; color: var(--accent);
  font-weight: 400;
}
.hero-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 1.15rem;
  color: var(--paper-soft);
  letter-spacing: 0.12em; max-width: 580px;
  line-height: 1.8;
  opacity: 0; animation: heroFadeUp 1.6s ease 1.1s forwards;
}
.hero-sub-poem {
  display: inline-block;
  font-style: italic;
  font-size: 1.45rem;
  letter-spacing: 0.16em;
  color: var(--paper);
  margin-bottom: 0.4rem;
}
.hero-scroll {
  position: absolute; bottom: 3rem; left: 50%;
  transform: translateX(-50%); z-index: 2;
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.85rem; letter-spacing: 0.4em;
  color: var(--paper-soft); text-transform: uppercase;
  opacity: 0; animation: heroFadeUp 1.6s ease 1.5s forwards;
}
.hero-scroll::after {
  content: ""; display: block;
  width: 1px; height: 48px; background: var(--paper-soft);
  margin: 1rem auto 0;
  animation: scrollLine 2.2s ease-in-out infinite;
  transform-origin: top;
}
@keyframes heroFadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes scrollLine {
  0%, 100% { transform: scaleY(0.3); opacity: 0.3; }
  50% { transform: scaleY(1); opacity: 1; }
}
@media (max-width: 768px) {
  #hero { padding: 0 1.5rem; }
  .hero-mark { font-size: 0.78rem; margin-bottom: 1.8rem; }
  .hero-mark::before { width: 22px; margin-right: 0.8rem; }
  .hero-sub-poem { font-size: 1.18rem; letter-spacing: 0.12em; }
  .hero-scroll { font-size: 0.7rem; bottom: 2rem; }
  .hero-scroll::after { height: 32px; }
}

/* ===== SECTION COMMON ===== */
section {
  padding: 9rem 3rem;
  position: relative;
}
@media (max-width: 768px) {
  section { padding: 5rem 1.5rem; }
}
.section-head {
  max-width: 1280px; margin: 0 auto 5rem;
  display: flex; align-items: baseline; gap: 2rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 1.6rem;
}
.section-label {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.9rem; letter-spacing: 0.24em;
  color: var(--paper-soft); text-transform: uppercase;
}
.section-title {
  font-family: 'Cormorant Garamond', serif; font-weight: 400;
  font-size: clamp(2rem, 4vw, 3.4rem);
  letter-spacing: 0.04em; color: var(--paper);
}
@media (max-width: 768px) {
  .section-head { margin-bottom: 3rem; flex-direction: column; gap: 0.4rem; align-items: flex-start; }
}

/* ===== WORKS ===== */
#works { padding-top: 7rem; }
.works-lead {
  max-width: 1280px; margin: 0 auto 4.5rem;
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 1.18rem; line-height: 2;
  color: var(--paper-soft);
  letter-spacing: 0.04em;
  max-width: 720px;
}
.works-grid {
  max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 4rem 3rem;
}
@media (max-width: 768px) {
  .works-grid { grid-template-columns: 1fr; gap: 3rem; }
  .works-lead { font-size: 1.02rem; line-height: 1.85; margin-bottom: 3rem; }
}
.work-card {
  cursor: pointer; position: relative;
  transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}
.work-card.is-coming { cursor: default; opacity: 0.4; }
.work-card.is-coming .work-frame { min-height: 220px; }
.work-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  background: var(--ink-soft);
  overflow: hidden;
  border: 1px solid var(--line);
  transition: border-color 0.6s ease;
}
.work-frame img {
  display: block;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  background: var(--ink);
  transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), filter 0.6s ease;
  filter: brightness(0.96);
}
.work-card:hover .work-frame { border-color: var(--accent); }
.work-card:hover .work-frame img { transform: scale(1.025); filter: brightness(1.0); }
.work-coming-mark {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.95rem; letter-spacing: 0.32em;
  color: var(--paper-mute); text-transform: uppercase;
}
.work-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 1.4rem; gap: 1.5rem;
  padding-bottom: 0.4rem;
}
.work-num {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.95rem; color: var(--accent);
  letter-spacing: 0.2em; flex-shrink: 0;
}
.work-info { flex: 1; }
.work-name {
  font-family: 'Noto Serif JP', serif; font-weight: 400;
  font-size: 1.05rem; line-height: 1.55;
  color: var(--paper); letter-spacing: 0.02em;
}
.work-type {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.85rem; color: var(--paper-soft);
  letter-spacing: 0.14em; margin-top: 0.4rem;
}
.work-imgcount {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.78rem; color: var(--paper-mute);
  letter-spacing: 0.2em; flex-shrink: 0; align-self: flex-start;
  padding-top: 0.3rem;
}

/* ===== ABOUT / PHILOSOPHY ===== */
#about { background: var(--ink-soft); }
.about-grid {
  max-width: 1100px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1.4fr;
  gap: 5rem; align-items: start;
}
.about-pull {
  font-family: 'Noto Serif JP', serif; font-weight: 300;
  font-size: clamp(1.3rem, 2.2vw, 1.7rem);
  line-height: 1.85; color: var(--paper);
  letter-spacing: 0.04em;
  border-left: 1px solid var(--accent);
  padding-left: 2rem;
}
.about-body {
  font-size: 0.98rem; line-height: 2.0;
  color: var(--paper-soft);
}
.about-body p + p { margin-top: 1.5rem; }
.about-body em {
  font-style: italic; color: var(--paper);
  font-family: 'Cormorant Garamond', serif;
}
@media (max-width: 768px) {
  .about-grid { grid-template-columns: 1fr; gap: 2.5rem; }
  .about-pull { padding-left: 1.2rem; font-size: 1.15rem; }
}

/* ===== TECHNOLOGY ===== */
.tech-list {
  max-width: 1100px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 0;
}
.tech-item {
  padding: 2rem 2rem 2rem 0;
  border-right: 1px solid var(--line);
}
.tech-item:nth-child(3n) { border-right: none; padding-right: 0; }
.tech-item:nth-child(n+4) { padding-top: 3rem; border-top: 1px solid var(--line); margin-top: 0; }
.tech-num {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.85rem; color: var(--accent);
  letter-spacing: 0.24em; margin-bottom: 0.8rem;
}
.tech-title {
  font-family: 'Noto Serif JP', serif; font-weight: 400;
  font-size: 1.1rem; color: var(--paper);
  margin-bottom: 0.8rem; line-height: 1.5;
}
.tech-desc {
  font-size: 0.88rem; line-height: 1.85;
  color: var(--paper-soft);
}
@media (max-width: 768px) {
  .tech-list { grid-template-columns: 1fr; }
  .tech-item { border-right: none; border-bottom: 1px solid var(--line); padding: 1.6rem 0; }
  .tech-item:nth-child(n+4) { padding-top: 1.6rem; border-top: none; }
  .tech-item:last-child { border-bottom: none; }
}

/* ===== CLIENTS ===== */
#clients { background: var(--ink-soft); }
.clients-grid {
  max-width: 1100px; margin: 0 auto;
  columns: 3; column-gap: 4rem;
  font-size: 0.92rem;
  color: var(--paper-soft);
  line-height: 2.1;
}
.clients-grid li {
  list-style: none;
  break-inside: avoid;
  padding: 0.15rem 0;
}
@media (max-width: 768px) {
  .clients-grid { columns: 1; }
}

/* ===== CONTACT ===== */
#contact { text-align: center; padding: 8rem 3rem; }
.contact-tagline {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: clamp(1.4rem, 2.5vw, 2rem);
  color: var(--paper-soft);
  margin-bottom: 2.4rem; letter-spacing: 0.06em;
  line-height: 1.6;
}
.contact-mail {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.6rem, 3.5vw, 2.6rem);
  color: var(--accent);
  letter-spacing: 0.12em;
  border-bottom: 1px solid var(--accent);
  padding-bottom: 0.4rem;
  display: inline-block;
  transition: color 0.4s ease, border-color 0.4s ease;
}
.contact-mail:hover { color: var(--paper); border-color: var(--paper); }
.contact-info {
  margin-top: 3rem;
  font-size: 0.92rem; color: var(--paper-mute);
  letter-spacing: 0.08em;
  line-height: 2;
}
footer {
  border-top: 1px solid var(--line);
  padding: 2rem 3rem;
  text-align: center;
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.78rem; letter-spacing: 0.2em;
  color: var(--paper-mute);
}

/* ===== LIGHTBOX ===== */
.lightbox {
  position: fixed; inset: 0; z-index: 200;
  background: #0b0a09;
  display: none;
  opacity: 0; transition: opacity 0.45s ease;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.lightbox.is-open { display: block; opacity: 1; }
.lb-header {
  padding: 1.2rem 2rem;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 10;
  background: #0b0a09;
}
.lb-counter {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.95rem; letter-spacing: 0.22em;
  color: var(--paper-soft);
}
.lb-close {
  background: none; border: none; cursor: pointer;
  color: var(--paper); font-size: 1.6rem;
  font-family: 'Cormorant Garamond', serif;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line);
  transition: border-color 0.3s ease, color 0.3s ease;
}
.lb-close:hover { border-color: var(--accent); color: var(--accent); }

.lb-stage {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  padding: 2rem;
  width: 100%; box-sizing: border-box;
}
.lb-img-wrap {
  position: relative;
  width: 100%;
  display: flex; align-items: center; justify-content: center;
}
.lb-img {
  max-width: 100%; max-height: 78vh;
  width: auto; height: auto;
  object-fit: contain;
  transition: opacity 0.4s ease;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}
.lb-img.loading { opacity: 0; }

.lb-nav {
  position: absolute; top: 50%;
  transform: translateY(-50%);
  background: rgba(11,10,9,0.85); border: 1px solid rgba(255,255,255,0.3);
  color: #ffffff; cursor: pointer;
  width: 52px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.8rem;
  transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  z-index: 2;
}
.lb-nav:hover { border-color: var(--accent); color: var(--accent); background: rgba(11,10,9,0.95); }
.lb-prev { left: 1.5rem; }
.lb-next { right: 1.5rem; }
.lb-nav.is-hidden { display: none; }

.lb-footer {
  display: block;
  padding: 2rem 2rem 2.4rem;
  border-top: 1px solid var(--line);
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
  box-sizing: border-box;
  text-align: center;
  background: transparent;
}
.lb-title {
  font-family: 'Noto Serif JP', serif; font-weight: 400;
  font-size: clamp(1.1rem, 2vw, 1.5rem);
  color: var(--paper); letter-spacing: 0.04em; line-height: 1.55;
  margin-bottom: 0.6rem;
}
.lb-meta {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.9rem; letter-spacing: 0.18em;
  color: var(--paper-soft);
  margin-bottom: 1rem;
}
.lb-desc {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.1rem; line-height: 2.1;
  font-weight: 500;
  color: #ffffff;
  max-width: 640px; margin: 0 auto 1.4rem;
  text-align: left;
  letter-spacing: 0.03em;
}
.lb-desc em {
  font-style: italic;
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.05em;
}
.lb-desc:empty { display: none; }
.lb-credit {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.82rem; line-height: 1.85;
  color: var(--paper-mute);
  letter-spacing: 0.04em;
}
.lb-credit:empty { display: none; }

/* タイトル+メタを画像の上に配置 */
.lb-caption {
  display: block;
  padding: 1.8rem 2rem 1.2rem;
  text-align: left;
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
  box-sizing: border-box;
}
.lb-caption .lb-title {
  font-family: 'Noto Serif JP', serif; font-weight: 400;
  font-size: clamp(1.2rem, 2.4vw, 1.7rem);
  color: var(--paper); letter-spacing: 0.04em; line-height: 1.55;
  margin-bottom: 0.7rem;
}
.lb-caption .lb-meta {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.95rem; letter-spacing: 0.22em;
  color: var(--accent);
  margin-bottom: 0;
}
.lb-back {
  margin-top: 2rem;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--paper);
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.95rem;
  letter-spacing: 0.18em;
  padding: 0.9rem 1.8rem;
  cursor: pointer;
  transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
}
.lb-back:hover, .lb-back:active { border-color: var(--accent); color: var(--accent); background: rgba(201, 168, 117, 0.08); }

/* ===== SCROLL TOP BUTTON ===== */
.scroll-top {
  position: fixed; right: 1.2rem; bottom: 1.2rem;
  width: 46px; height: 46px;
  border-radius: 50%;

  cursor: pointer; z-index: 150;…17837 tokens truncated…eets the business and commercial Minatomirai 21 district, a large-scale project, 'The Tower Yokohama Kitanaka', transforms the Yokohama skyline. On the concept of the four elements — <em>earth, water, fire and wind</em> — glass adorns the lobby. Forms that hold the mass of glass while shifting in the gradation of light and color; the main body 300Φ × H550 mm. The layered glass dramatically transforms light and landscape.", "c": "Glass Object Design &amp; Production: atelier TECNOFORM / Noriaki Eto"}, "14": {"t": "Mitsui Fudosan Residential Park Court<br>JR Ashiya Station — Entrance Lobby", "d": "On the theme of <em>the sway of wind and the water's surface</em>, laminated art-glass panels that carry flow and movement. Between marble-like white columns and bands of dark bronze, tall glass panels run in sequence; layered bronze curve patterns, ripple glass and crack finishing summon the quiet presence of a water surface into the entrance lobby."}, "18": {"t": "Hotel Keihan Temmabashi<br>Guest-Room Washi Objects & Wall Panels", "d": "A series adorning the guest rooms. A spiral, twisting tabletop light of three-dimensional washi — made with Sugihara-gami, a traditional craft paper of Hyogo — lets its inner 3D-printed frame show through, casting soft light. The wall panels inlay crossing hemp threads and glass stones — clear, gray, blue and black — onto a slender washi base. The washi surfacing of the ceiling light and fusuma sliding doors was crafted in the same Sugihara-gami, carrying its texture through the whole room. Forms echoing flowing water offer a quiet lodging for a moment in a business or sightseeing stay."}, "20": {"t": "Presance Legend Biwako<br>Entrance & Model Room", "d": "One of the largest projects on the shore of Lake Biwa. On the site of the former inn 'Momiji', 486 exceptional residences are born — homes that command Japan's finest waterscape from every unit.<br><br>The <em>entrance lobby</em> renders the scene of a water surface through mirror-based color-flow technique layered with textured glass. In the <em>model room</em>, the edges of sheet glass are crack-finished and bonded in layers, expressing the glitter and scene of water."}, "21": {"t": "Plenus Co., Ltd.<br>Tokyo Headquarters — Glass Art Collection", "d": "A long-term glass-art project from 2007 to 2020 at the Tokyo headquarters (Nihonbashi Kayabacho) of Plenus, operator of Hotto Motto and Yayoiken.<br><br>Beginning with the entrance <em>Color Cube series</em> (2007–), a body of five works took shape: the spring of life 'Shioi' on 7F (2014), the <em>Four Seasons of the Terraced Rice Fields</em> in the guesthouse atrium (2020), the <em>tea-room borrowed-scenery glass</em> (2020) and the <em>president's-office reinforced art glass</em> (2020).<br><br>The atrium, where Morihiro Hosokawa's mural unites with the glass art, serves as a stage conveying Japan's food culture to visitors from home and abroad — an artistic integration of the whole building, born of the long partnership between Plenus and atelier TECNOFORM since 2007.", "c": "Glass Art Design &amp; Production: atelier TECNOFORM<br>Mural Painting 'Four Seasons of the Terraced Rice Fields': Morihiro Hosokawa"}, "29": {"t": "iikids Osaka Bentencho<br>Entrance Symbol Glass Art", "d": "The symbol glass art for <em>iikids</em>, a complex of English education and after-school care. With the Norse world-tree <em>Yggdrasil</em> as its central motif, vivid textured glass, mirror layering and Swarovski crystals express the individuality and possibility of children. Keywords such as <em>innovation, identity, imagination</em> and <em>integrity</em> are embedded in the trunk of the world tree.", "c": "Symbol Glass Art Design &amp; Production: atelier TECNOFORM / Noriaki Eto"}, "30": {"t": "Mino Washi Museum<br>'Fantasia of Japanese Paper' Exhibition", "d": "Exhibited at the Mino Washi Museum's special exhibition <em>Fantasia of Japanese Paper</em> (19 Dec 2024 – 10 Mar 2025). atelier TECNOFORM created elliptical objects of three-dimensional hand-poured washi, the <em>KUMO Lamp</em> (cloud) and a group of <em>lotus-form pendants</em>. Centered on geometric objects formed by the twist of solids of revolution, and lamps themed on rice and lotus flowers, some twenty lighting works enveloped the whole space in a washi fantasy.<br><br>The <em>washi dresses</em> in the venue were created by <em>Yadorigi Art (Megumi Eto)</em> — realizing a concertante space where light and cloth, solid and plane, echo one another.", "c": "Overall Direction &amp; Lighting Installation: atelier TECNOFORM / Noriaki Eto<br>Paper Dress Works: Yadorigi Art / Megumi Eto"}, "22": {"t": "Rokko Silence Resort<br>'Japanese Paper: Tradition and Future' Exhibition", "d": "The exhibition <em>Japanese Paper: Tradition and Future</em>, held at Rokko Silence Resort (Nada-ku, Kobe), 15 April – 9 May 2021. On the theme of enriching the world of washi through <em>dialogue across generations</em> and creating new expression, the Kobe-based artists Megumi Eto and Noriaki Eto presented their works, shown alongside pieces by <em>Isao Nakamura</em>, a Haigyū-washi craftsman from Tokushima.<br><br>The base motif was the <em>Shichidanka</em> — a hydrangea recorded since the Edo period and rediscovered on Mt. Rokko after roughly 130 years. Its petal structure was designed parametrically; the frames were 3D-printed by stereolithography (SLA / soybean oil and acrylic resin) and fused deposition modeling (FDM / biodegradable plastic), then layered with hand-poured washi into three-dimensional forms.<br><br>A group of <em>light objects</em> inspired by radiolaria converses with <em>wearable works</em> — washi dresses, corsages and hats. Using eco-friendly, sustainable and recyclable materials, washi — a traditional material — is reborn wearing contemporary form-making and light.<br><br>Washi sculptures by <em>Yadorigi Art (Megumi Eto)</em>; light objects and overall direction by <em>atelier TECNOFORM (Noriaki Eto)</em>.", "c": "Overall Direction &amp; Light Objects: atelier TECNOFORM / Noriaki Eto<br>Washi Sculpture &amp; Dress Works: Yadorigi Art / Megumi Eto<br>Guest Artist (Traditional Washi): Isao Nakamura (Haigyū Washi, Tokushima)<br>Art Direction: Megumi Eto"}, "15": {"t": "Shinai Obstetrics & Gynecology<br>Corridor Wall — Life on the Planet Earth", "d": "On the theme of <em>parents and children upon the earth</em>, a wall of light for the waiting corridor. Silhouettes of animal parents and their young run in gradation from blue to purple, red and green, expressing the chain of life and the bond of mother and child. The time spent waiting becomes time spent gazing at the landscape of the earth."}, "19": {"t": "Tokyu Land Branz Nishinomiya-Kitaguchi<br>Entrance Lobby Art Glass", "d": "Created in a changing, mirror-based material that reflects the light of the four seasons. Not a work to be appreciated for the artist's expression like a painting, but something meant to be like a flower — bringing moisture and change to daily life."}, "27": {"t": "Itakura Ladies Clinic<br>Annex Atrium Wall — Glass Art", "d": "On the theme of the sea of life, a five-part series of reinforced laminated art-glass panels unfolds across the annex's atrium wall. Manta rays, whales and coral-reef life are expressed through color-flow and inlay, sealing the spectrum of marine life — a flow from green to red and blue — into a single plane. The time spent waiting becomes a journey across the sea of life."}, "28": {"t": "Daikin Tottori Training Center<br>Special Guest Room — Reinforced Pair-Glass Art", "d": "In the special guest room of a training center in Tottori overlooking the Sea of Japan, a reinforced pair-glass art with blue glass blocks set adrift. Echoing the sea beyond the window, the rhythm of waves is translated into an abstract pattern. In a quiet interval between sessions, the memory of the sea gently keeps company."}, "31": {"t": "Sysmex Corporation Solution Center<br>Reception Room — Art Glass Panels", "d": "In the reception room of the Sysmex Solution Center in Kobe's Nishi-ku, a group of art-glass panels with circular glass inlay. Overlapping petal-like geometric patterns receive the visitor's gaze softly, translating the company's philosophy of research and development into the language of space."}, "X2": {"t": "RIHGA Royal Resort Okinawa (Chatan) — Kumo Lamp"}, "X3": {"t": "Panasonic Hibiya — Ritsurei Tea Room 'Tokushin-ken'", "d": "A ryurei (standing-style) tea room, 'Tokushin-ken', at Panasonic Tokyo Hibiya. A hand-poured washi shade is fitted over the existing ceiling light, softening its glow over the tea setting. Without altering the room, the washi shadows alone turn the space into a scene for tea."}};

rified in the digital, finished by hand."], ".tech-process-cap": ["Daimaru Kobe Entrance Glass Art Wall / 01 and 02 are design data and VR renderings by Noriaki Eto; 03 is a photograph after installation.<br>Space Design: Kenichi Yoshizato (cmyk)　Craft Direction: ubushina (Yudai Tachikawa)"], ".tech-process-grid figcaption": ["01 — Design data｜Rhino + V-Ray", "02 — VR simulation｜light & the frontal view", "03 — VR simulation｜reflections & figures", "04 — Installation｜Daimaru Kobe"], ".about-pull": ["Light takes up residence,<br>and the material begins to speak."], ".about-body p": ["Glass form-work, 3D-printed form-work, hand-poured washi form-work — integrating multiple techniques, we create and install, encompassing the design of the entire architectural space. From our atelier in Sumiyoshi-Yamate, Kobe, we take on projects across Japan and abroad.", "A formal philosophy learned from Art Nouveau, Japonisme and the light sculptures of <em>Isamu Noguchi</em>, layered onto the handwork of glass and washi.", "Glass form-work: <em>Noriaki Eto</em><br>Washi form-work: <em>Megumi Eto</em> (Yadorigi Art) / <em>Noriaki Eto</em><br>Art Direction: <em>Megumi Eto</em>", "Scope of business: planning, creation and installation of art works and spatial decoration in glass, washi and hemp / design and fabrication of three-dimensional forms / planning, production and supervision of interior and commercial-space design / related activities.", "Since its founding in 1983, with a team of artist, art director and production partners, we have handled everything from design to making and installation in-house, taking responsibility for structure and safety.", "atelier TECNOFORM Inc;<br>3-3-18 Sumiyoshi-Yamate, Higashinada-ku, Kobe, Hyogo 658-0063, Japan<br>Established November 1983 &nbsp;/&nbsp; Representative: Noriaki Eto"], "#clients .clients-grid li": ["Canopy by Hilton Okinawa Miyakojima", "The Ritz-Carlton Tokyo", "Renaissance Taipei Shilin", "Hotel Keihan", "RIHGA Royal Resort", " <script>
(function(){
  var hero=document.getElementById('hero'), canvas=document.getElementById('hero-water');
  if(!hero||!canvas) return;
  var ctx=canvas.getContext('2d');
  var cols,rows,cur,prev,off,offCtx,offImg,offData, damping=0.973, W=0,H=0, t0=Date.now();
  function build(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W=hero.clientWidth||window.innerWidth; H=hero.clientHeight||window.innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var target=150;
    if(H>=W){rows=target;cols=Math.max(40,Math.round(target*(W/H)));}
    else{cols=target;rows=Math.max(40,Math.round(target*(H/W)));}
    cur=new Float32Array(cols*rows); prev=new Float32Array(cols*rows);
    off=document.createElement('canvas'); off.width=cols; off.height=rows;
    offCtx=off.getContext('2d'); offImg=offCtx.createImageData(cols,rows); offData=offImg.data;
  }
  build();
  var rt; addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(build,200); });
  addEventListener('load', build);
  function drop(lx,ly,s){
    var gx=Math.floor(lx/W*cols), gy=Math.floor(ly/H*rows), R=3;
    for(var y=-R;y<=R;y++)for(var x=-R;x<=R;x++){
      var nx=gx+x,ny=gy+y;
      if(nx<1||ny<1||nx>=cols-1||ny>=rows-1)continue;
      var d2=x*x+y*y; if(d2>R*R)continue;
      cur[nx+ny*cols]+=s*(1-Math.sqrt(d2)/R);
    }
  }
  function step(){
    for(var y=1;y<rows-1;y++){var r=y*cols;
      for(var x=1;x<cols-1;x++){var i=r+x;
        var n=(cur[i-1]+cur[i+1]+cur[i-cols]+cur[i+cols])*0.5-prev[i]; n*=damping; prev[i]=n;}}
    var t=cur;cur=prev;prev=t;
  }
  function render(){
    var d=offData, N=cols*rows, t=(Date.now()-t0)/1000;
    for(var i=0,p=0;i<N;i++,p+=4){
      var x=i%cols, y=(i/cols)|0, nx=x/cols, ny=y/rows;
      var sx=(x>0&&x<cols-1)?(cur[i-1]-cur[i+1]):0;
      var sy=(i>=cols&&i<N-cols)?(cur[i-cols]-cur[i+cols]):0;
      var spec=sx*0.7+sy*0.7;
      var glint=spec>0?(spec/32):0; if(glint>1)glint=1;
      var energy=Math.abs(cur[i])/65; if(energy>1)energy=1;
      // 風：水面全体がゆっくり流れる光の帯
      var w=Math.sin(nx*4.2 + t*0.55)*Math.sin(ny*3.0 - t*0.42);
      var wind = w>0 ? Math.pow(w,1.6)*0.13 : 0;
      var a=glint*0.5+energy*0.14+wind; if(a>0.5)a=0.5;
      d[p]=240; d[p+1]=230; d[p+2]=206; d[p+3]=a*255;
    }
    offCtx.putImageData(offImg,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(off,0,0,W,H);
  }
  function loop(){ if(hero.getBoundingClientRect().bottom>0){ step(); render(); } requestAnimationFrame(loop); }
  loop();
  setTimeout(function(){ drop(W*0.5,H*0.44,200); }, 500);
  var lastMove=0;
  function pt(e){
    var t=e.touches?e.touches[0]:e, r=hero.getBoundingClientRect();
    var lx=t.clientX-r.left, ly=t.clientY-r.top;
    if(lx<0||ly<0||lx>W||ly>H)return;
    if(e.type==='mousemove'){ var now=Date.now(); if(now-lastMove<60)return; lastMove=now; drop(lx,ly,26); }
    else drop(lx,ly,115);
  }
  addEventListener('mousemove',pt,{passive:true});
  addEventListener('touchstart',pt,{passive:true});
  setInterval(function(){
    if(hero.getBoundingClientRect().bottom<=0)return;
    drop(W*(0.15+Math.random()*0.7), H*(0.2+Math.random()*0.6), 45+Math.random()*30);
  }, 5500);
})();
</script>
